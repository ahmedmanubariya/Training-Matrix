{% extends 'base.html' %}
{% block content %}
<div class="panel narrow">
  <h1>Change password</h1>
  <p>Your temporary password must be replaced before continuing.</p>
  <form method="post" class="stack">
    <label>Current password<input type="password" name="old_password" required></label>
    <label>New password<input type="password" name="new_password" minlength="12" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" minlength="12" required></label>
    <button>Update password</button>
  </form>
</div>
{% endblock %}
